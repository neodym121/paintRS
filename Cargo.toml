[workspace]
resolver = "2"
members = ["crates/paint-core", "crates/paint-ui", "crates/paint-app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/neodym121/paintRS"
rust-version = "1.85"

[workspace.dependencies]
paint-core = { path = "crates/paint-core" }
paint-ui = { path = "crates/paint-ui" }
egui = { version = "0.37", default-features = false }
egui-wgpu = { version = "0.37", default-features = false }
bytemuck = { version = "1", features = ["derive"] }
eframe = { version = "0.37", default-features = false }
image = { version = "0.25", default-features = false }
png = "0.18"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi", "tracing-log"] }
serde = { version = "1", features = ["derive"] }
toml = "0.9"
directories = "6"
rfd = "0.17"
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd"] }

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
opt-level = 3

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
