[package]
name = "paint-app"
description = "PaintRS application entry point"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "paintrs"
path = "src/main.rs"

[dependencies]
paint-core.workspace = true
paint-ui.workspace = true
eframe = { workspace = true, features = ["wgpu_no_default_features", "clipboard", "x11", "wayland"] }
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
toml.workspace = true
directories.workspace = true
rfd.workspace = true

# Only the GPU backends each platform needs (keeps the binary small).
[target.'cfg(windows)'.dependencies]
wgpu = { version = "30", default-features = false, features = ["std", "wgsl", "dx12"] }

[target.'cfg(target_os = "linux")'.dependencies]
wgpu = { version = "30", default-features = false, features = ["std", "wgsl", "vulkan", "gles"] }

[target.'cfg(target_os = "macos")'.dependencies]
wgpu = { version = "30", default-features = false, features = ["std", "wgsl", "metal"] }
